version: 2

sources:
  - name: raw
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET_RAW', 'github_pulse_raw') }}"
    tables:
      - name: events
        identifier: "{{ env_var('BQ_RAW_TABLE', 'events') }}"
        description: >
          Raw GH Archive events loaded by ingestion/load_bq.py — slim projection only.
          Partitioned by event_date, clustered by event_type.
        loaded_at_field: created_at
        columns:
          - name: id
            description: GitHub event id (string). Dedupe key.
          - name: event_date
            description: DATE partition key. ALWAYS filter on this.

      - name: repo_language
        description: >
          Repo -> language cache, fetched from the GitHub REST API by
          ingestion/enrich_language.py (language is no longer present on live PR event payloads).
          Append-only and deliberately UNPARTITIONED — do not add partitioning to this table.
          The raw dataset's 30-day default_partition_expiration_ms only applies to partitioned
          tables, so leaving this one unpartitioned is what keeps the cache from being silently
          wiped and re-triggering a full refetch.
