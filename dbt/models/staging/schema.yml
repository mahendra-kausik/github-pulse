version: 2

models:
  - name: stg_github_events
    description: One cleaned, deduped row per GH Archive event.
    columns:
      - name: event_id
        description: GitHub event id.
        data_tests:
          - not_null
          - unique
      - name: event_type
        description: Event type.
        data_tests:
          - not_null
          - accepted_values:
              values: ["PushEvent", "WatchEvent", "IssuesEvent", "PullRequestEvent", "ForkEvent"]
      - name: event_date
        description: DATE partition key.
        data_tests:
          - not_null
      - name: repo_id
        description: Repository id.

  - name: stg_repo_language
    description: >
      One row per repo_id, deduped to the freshest fetch from the language cache
      (raw.repo_language, populated by ingestion/enrich_language.py via the GitHub REST API).
    columns:
      - name: repo_id
        description: Repository id.
        data_tests:
          - not_null
          - unique
      - name: language
        description: Repo's primary language, or null (not yet enriched, or genuinely language-less).
