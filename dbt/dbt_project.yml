name: github_pulse
version: "0.1.0"
config-version: 2

profile: github_pulse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Lower bound for the event_date filters in staging/marts. Its ONLY job is to keep a constant
  # partition filter present so `require_partition_filter` is satisfied and scans stay prunable.
  #
  # It must stay OLDER than the retention horizon, never track it. raw.events has a hard 30-day
  # partition expiration (terraform/main.tf), so that is already the real lower bound on what
  # exists; a second bound here that tries to "roll forward" only duplicates the same logic in a
  # place that drifts. This was previously pinned to the 2026-08-06 live-cutover date, which
  # silently dropped every backfilled day from the marts — dbt still reported success because the
  # rows simply never matched the filter. Keep it aligned with the in-model defaults below.
  start_date: "2024-01-01"

models:
  github_pulse:
    staging:
      +materialized: view
    marts:
      +materialized: table
      # No +schema override: both layers land in the profile's target dataset
      # (github_pulse_marts), which Terraform creates and the pipeline SA can write to.
      # A `+schema: X` here would make dbt target `github_pulse_marts_X` instead, which
      # neither Terraform creates nor the least-privileged SA can create on the fly.
