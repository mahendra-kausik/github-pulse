name: github_pulse
version: "0.1.0"
config-version: 2

profile: github_pulse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Lower bound for the event_date filters in staging/marts. Rolls forward as the raw table's
  # 30-day partition expiration ages out older partitions (terraform/main.tf) — override with
  # --vars for a one-off historical run.
  start_date: "2026-08-06"

models:
  github_pulse:
    staging:
      +materialized: view
    marts:
      +materialized: table
      # No +schema override: both layers land in the profile's target dataset
      # (github_pulse_marts), which Terraform creates and the pipeline SA can write to.
      # A `+schema: X` here would make dbt target `github_pulse_marts_X` instead, which
      # neither Terraform creates nor the least-privileged SA can create on the fly.
