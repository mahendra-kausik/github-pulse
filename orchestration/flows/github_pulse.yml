id: github_pulse
namespace: github.pulse

# Daily batch: download -> upload_gcs -> load_bq -> dbt build, for one date.
# - Scheduled run: the `date` input default resolves to yesterday (GH Archive lags ~a day).
# - Manual/backfill run: set the `date` input — via the UI's "Trigger backfill" on the Schedule
#   trigger (runs one execution per missed day), or `kestra flow execute github.pulse
#   github_pulse --inputs date=2024-01-01` per day. For local-only backfills that skip Kestra
#   and dbt entirely, `make backfill START=2024-01-01 DAYS=7` runs just the ingestion stages.

inputs:
  - id: date
    type: STRING
    defaults: "{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"
    description: UTC date to ingest, YYYY-MM-DD

variables:
  repo_url: "https://github.com/mahendra-kausik/github-pulse.git"

tasks:
  - id: pipeline
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        url: "{{ vars.repo_url }}"
        branch: main

      # Both tasks run via Kestra's default Process runner, inside the Kestra container itself.
      # That container already has the GCP env vars (docker-compose.yml env_file) and the SA key
      # mount (./secrets:/secrets:ro) — a Docker task runner would need its own docker.sock mount
      # and its own secret plumbing to reach either, for no benefit at this scale.
      - id: ingest
        type: io.kestra.plugin.scripts.python.Commands
        commands:
          - pip install -q -r requirements.txt
          - python -m ingestion.download   --date {{ inputs.date }}
          - python -m ingestion.transform  --date {{ inputs.date }}
          - python -m ingestion.upload_gcs --date {{ inputs.date }}
          - python -m ingestion.load_bq    --date {{ inputs.date }}

      - id: dbt_build
        type: io.kestra.plugin.scripts.python.Commands
        commands:
          - pip install -q dbt-bigquery==1.8.2
          - cd dbt && dbt build --target service_account

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"   # 06:00 UTC daily; GH Archive for "yesterday" is available by then
