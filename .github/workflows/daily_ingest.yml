name: daily-ingest

# Runs the live pipeline against real GCP credentials, so unlike ci.yml this never triggers on
# push/PR — only on schedule and manual dispatch. Kestra (orchestration/flows/github_pulse.yml)
# runs this same command sequence on demand; this is what runs it unattended every day.
on:
  schedule:
    # 06:23 UTC (11:53 AM IST). Deliberately off :00 and :30 — GitHub defers scheduled runs on
    # shared runners when a slot is contested, and the top of the hour is where every cron piles
    # up. Measured on 2026-08-14 at "0 6": due 06:00 UTC, actually started 07:16 UTC — 77 min late.
    # Still ~6h of margin, since GH Archive finishes publishing a UTC day shortly after 00:00 UTC.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to ingest (YYYY-MM-DD); defaults to yesterday"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: mini-raft-prod
      GCP_REGION: us-central1
      GCS_BUCKET: github-pulse-lake-nfc26
      BQ_DATASET_RAW: github_pulse_raw
      BQ_DATASET_MARTS: github_pulse_marts
      BQ_RAW_TABLE: events
      MAX_BYTES_BILLED: "20000000000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target date
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then
            D=$(date -u -d 'yesterday' +%Y-%m-%d)
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"

      - name: Ingest
        run: |
          python -m ingestion.download   --date ${{ steps.d.outputs.date }}
          python -m ingestion.transform  --date ${{ steps.d.outputs.date }}
          python -m ingestion.upload_gcs --date ${{ steps.d.outputs.date }}
          python -m ingestion.load_bq    --date ${{ steps.d.outputs.date }}

      # Restores repo language (no longer present on live PR event payloads) via the GitHub
      # REST API, cached in BQ. Must run before dbt build — agg_language_daily/dim_repo read
      # the cache. See ingestion/enrich_language.py + CLAUDE.md "Data semantics".
      - name: Enrich language
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m ingestion.enrich_language

      - name: dbt build
        working-directory: dbt
        run: dbt build --target service_account
